<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*,*::before,*::after{box-sizing:border-box}body{margin:0}</style></head><body>
<title>CatchApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one calm screen at a time. A logo splash plays first, then Home shows a sport picker, an animated scene, one headline and one button; a floating pill dock switches screens. Each sport sets its own accent, sky and ground tokens on the root. Palette is navy ink on warm white to match the logo. */
:root {
  --bg: #FFFBF8;
  --surface: #FFFFFF;
  --surface-2: #F7EEEA;
  --ink: #25365A;
  --ink-2: #667491;
  --line: #EEE4E0;
  --ketchup: #D93A2B;
  --mustard: #F7BE1A;
  --on-mustard: #25365A;
  --mustard-bg: #FEF3D0;
  --amber: #7A5600;
  --green: #1F7A45;
  --green-bg: #E4F4EA;
  --blue: #3B6DB3;
  --logo-navy: #17294D;
  --logo-red: #E5392D;
  /* sport tokens: baseball by default */
  --accent: #D93A2B;
  --on-accent: #FFFFFF;
  --sky: #FDF2CF;
  --ground: #CFE6BC;

  --font-display: "Lilita One", "Arial Rounded MT Bold", Impact, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
:root[data-sport="football"] { --accent: #94552C; --on-accent: #FFFFFF; --sky: #F6E8D6; --ground: #D3E3AE; }
:root[data-sport="basketball"] { --accent: #CC4C08; --on-accent: #FFFFFF; --sky: #E4EFFA; --ground: #EFCF9E; }
:root[data-sport="soccer"] { --accent: #23824A; --on-accent: #FFFFFF; --sky: #E0F3F8; --ground: #B8E3A0; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151C30;
    --surface: #1F2840;
    --surface-2: #2A3452;
    --ink: #EAF0FA;
    --ink-2: #A9B6D0;
    --line: #313D5C;
    --ketchup: #FF6F5C;
    --mustard: #F6C21F;
    --on-mustard: #25365A;
    --mustard-bg: #3F3820;
    --amber: #F6C21F;
    --green: #6FD398;
    --green-bg: #1B3B2E;
    --blue: #8DB8F2;
    --logo-navy: #EAF0FA;
    --logo-red: #FF6F5C;
    --accent: #FF6F5C; --on-accent: #2A0A06; --sky: #3A3724; --ground: #2F4A31;
    color-scheme: dark;
  }
  :root:not([data-theme="light"])[data-sport="football"] { --accent: #E8A06C; --on-accent: #2A1408; --sky: #3A3228; --ground: #3C4A2C; }
  :root:not([data-theme="light"])[data-sport="basketball"] { --accent: #FF8F45; --on-accent: #2A1204; --sky: #243752; --ground: #6B5333; }
  :root:not([data-theme="light"])[data-sport="soccer"] { --accent: #62C48B; --on-accent: #07140C; --sky: #1E3F4A; --ground: #2D5A35; }
}
:root[data-theme="dark"] {
  --bg: #151C30;
  --surface: #1F2840;
  --surface-2: #2A3452;
  --ink: #EAF0FA;
  --ink-2: #A9B6D0;
  --line: #313D5C;
  --ketchup: #FF6F5C;
  --mustard: #F6C21F;
  --on-mustard: #25365A;
  --mustard-bg: #3F3820;
  --amber: #F6C21F;
  --green: #6FD398;
  --green-bg: #1B3B2E;
  --blue: #8DB8F2;
  --logo-navy: #EAF0FA;
  --logo-red: #FF6F5C;
  --accent: #FF6F5C; --on-accent: #2A0A06; --sky: #3A3724; --ground: #2F4A31;
  color-scheme: dark;
}
:root[data-theme="dark"][data-sport="football"] { --accent: #E8A06C; --on-accent: #2A1408; --sky: #3A3228; --ground: #3C4A2C; }
:root[data-theme="dark"][data-sport="basketball"] { --accent: #FF8F45; --on-accent: #2A1204; --sky: #243752; --ground: #6B5333; }
:root[data-theme="dark"][data-sport="soccer"] { --accent: #62C48B; --on-accent: #07140C; --sky: #1E3F4A; --ground: #2D5A35; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-inline: 16px;
  padding-block: 0 104px;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }

.app { max-width: 480px; margin-inline: auto; min-width: 0; }

.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 14px 8px;
}
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand b { font-family: var(--font-body); font-weight: 800; font-size: 25px; line-height: 1; letter-spacing: -.01em; }
.brand .b1 { color: var(--logo-navy); }
.brand .b2 { color: var(--accent); }
.top-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
.city-btn {
  display: inline-flex; align-items: center; gap: 4px; min-width: 0; max-width: 130px; border: 0; background: none; padding: 6px 2px;
  font-size: 14px; font-weight: 600; color: var(--ink-2);
}
.city-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me-btn {
  flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface);
  font-family: var(--font-display); font-size: 16px; display: grid; place-items: center;
}
.me-btn[aria-current="page"] { border-color: var(--ink); }

main { display: flex; flex-direction: column; gap: 18px; padding-block: 8px 16px; }

/* sport picker */
.sports { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.sports button {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 2px; min-height: 42px;
  font-size: 13.5px; font-weight: 700; color: var(--ink-2); transition: background .2s, color .2s, border-color .2s;
}
.sports button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* home */
.scene { border-radius: 24px; overflow: hidden; background: var(--sky); }
.scene svg { display: block; width: 100%; height: auto; }
.home-copy { display: flex; flex-direction: column; gap: 6px; text-align: center; }
.home-actions .home-links { justify-content: center; align-self: center; margin-top: 4px; }
.home-copy h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(32px, 9.6vw, 40px); line-height: 1; white-space: nowrap; }
.home-copy h1 span { color: var(--accent); }
.home-copy p { color: var(--ink-2); font-size: 17px; }
.home-actions { display: flex; flex-direction: column; align-items: stretch; gap: 10px; }

/* scene animation */
.bx { animation: bx 1.7s linear infinite alternate; }
.by { animation: by 1.7s infinite; }
.hop { animation: hop .85s infinite; }
.tilt { animation: tilt 1.7s linear infinite alternate; transform-box: fill-box; transform-origin: center; }
.roll { animation: roll 1.7s linear infinite alternate; transform-box: fill-box; transform-origin: center; }
.shoot { animation: shoot 4.2s infinite; }
.swap-a { animation: swapA 4.2s infinite; }
.swap-b { animation: swapB 4.2s infinite; }
@keyframes bx { from { transform: translateX(0); } to { transform: translateX(152px); } }
@keyframes by {
  0% { transform: translateY(0); animation-timing-function: cubic-bezier(.25,.75,.45,1); }
  50% { transform: translateY(-46px); animation-timing-function: cubic-bezier(.55,0,.75,.25); }
  100% { transform: translateY(0); }
}
@keyframes hop {
  0%, 100% { transform: translateY(0); animation-timing-function: cubic-bezier(.25,.75,.45,1); }
  50% { transform: translateY(-14px); animation-timing-function: cubic-bezier(.55,0,.75,.25); }
}
@keyframes tilt { from { transform: rotate(-30deg); } to { transform: rotate(30deg); } }
@keyframes roll { from { transform: rotate(0); } to { transform: rotate(540deg); } }
@keyframes shoot {
  0%, 8% { transform: translate(0, 0); animation-timing-function: cubic-bezier(.3,.6,.5,1); }
  26% { transform: translate(88px, -52px); animation-timing-function: cubic-bezier(.5,0,.8,.5); }
  40% { transform: translate(164px, 6px); animation-timing-function: linear; }
  47% { transform: translate(166px, 34px); animation-timing-function: ease-out; }
  52%, 54% { transform: translate(154px, 41px); animation-timing-function: ease-in-out; }
  60%, 64% { transform: translate(90px, 41px); animation-timing-function: cubic-bezier(.3,.6,.5,1); }
  72% { transform: translate(44px, 12px); animation-timing-function: ease-in; }
  80%, 100% { transform: translate(0, 0); }
}
@keyframes swapA { 0%, 54.9% { opacity: 1; } 55%, 100% { opacity: 0; } }
@keyframes swapB { 0%, 54.9% { opacity: 0; } 55%, 100% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .bx { animation: none; transform: translateX(76px); }
  .by { animation: none; transform: translateY(-46px); }
  .hop, .tilt, .roll, .swap-a { animation: none; }
  .swap-b { animation: none; opacity: 0; }
  .shoot { animation: none; transform: translate(88px, -52px); }
  .sports button { transition: none; }
}

/* buttons */
.btn {
  border: 0; border-radius: 999px; padding: 13px 20px; font-weight: 700; font-size: 17px; min-height: 52px;
  background: var(--accent); color: var(--on-accent); width: 100%;
}
.btn[disabled] { background: var(--surface-2); color: var(--ink-2); cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.small { width: auto; min-height: 42px; padding: 8px 18px; font-size: 15px; }
.linkbtn { background: none; border: 0; padding: 8px 0; color: var(--ink-2); text-decoration: underline; font-size: 15px; text-align: left; font-weight: 500; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 15px; font-size: 15px; font-weight: 600; min-height: 40px; }
.chip[aria-pressed="true"] { background: var(--mustard); border-color: var(--mustard); color: var(--on-mustard); }

/* screens */
h2.title { font-family: var(--font-display); font-weight: 400; font-size: 36px; line-height: 1; text-wrap: balance; }
.lead { color: var(--ink-2); }
.list { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; }
.name { font-family: var(--font-display); font-weight: 400; font-size: 23px; line-height: 1.1; }
.rating { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.when { font-weight: 700; font-size: 16px; }
.where { color: var(--ink-2); font-size: 15px; overflow-wrap: anywhere; }
.badge { flex: none; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); }
.badge.good { background: var(--green-bg); color: var(--green); }
.badge.wait { background: var(--mustard-bg); color: var(--amber); }
.sub { font-family: var(--font-display); font-weight: 400; font-size: 21px; color: var(--accent); }
.fine { font-size: 13px; color: var(--ink-2); }
.empty { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding-block: 8px; }
.empty p { color: var(--ink-2); }
.balls-row { display: flex; gap: 2px; align-items: center; }
.ball { display: inline-block; flex: none; }

.form { display: flex; flex-direction: column; gap: 20px; }
.field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.field label, .field .lab { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.input { width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 11px 14px; min-height: 50px; font-size: 16px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 340px) { .row2 { grid-template-columns: 1fr; } }

.rate { border-top: 1.5px dashed var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 14px; }
.rate h4 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; line-height: 1.15; }
.balls { display: flex; gap: 4px; }
.balls button { background: none; border: 0; padding: 2px; border-radius: 10px; line-height: 0; }
.rate-word { font-size: 14px; color: var(--ink-2); min-height: 1.4em; }
.actions { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 12px 16px; }
.stat b { display: flex; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: 400; font-size: 34px; line-height: 1.1; }
.stat span { font-size: 13px; color: var(--ink-2); }
.avatar-lg { width: 64px; height: 64px; border-radius: 50%; background: var(--mustard); color: var(--on-mustard); display: grid; place-items: center; font-family: var(--font-display); font-size: 26px; flex: none; }

/* floating dock */
.dock {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 10;
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: min(calc(100% - 32px), 440px);
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; padding: 5px;
  display: grid; grid-template-columns: repeat(4, 1fr);
  box-shadow: 0 8px 24px color-mix(in srgb, var(--ink) 10%, transparent);
}
.dock .thumb {
  position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc((100% - 10px) / 4);
  background: var(--accent); border-radius: 999px; transition: transform .3s cubic-bezier(.3,1.2,.5,1), opacity .2s, background .3s;
  pointer-events: none;
}
.dock button {
  position: relative; z-index: 1; border: 0; background: transparent; min-height: 46px; border-radius: 999px;
  font-weight: 700; font-size: 14.5px; color: var(--ink-2); transition: color .2s;
}
.dock button[aria-current="page"] { color: var(--on-accent); }
.dock .dot { position: absolute; top: 8px; right: 14%; width: 10px; height: 10px; border-radius: 50%; background: var(--mustard); border: 2px solid var(--surface); }
@media (prefers-reduced-motion: reduce) { .dock .thumb { transition: none; } }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14.5px; font-weight: 600; max-width: calc(100% - 32px); text-align: center;
}

a.linkbtn { display: inline-block; }
.story a.linkbtn { align-self: flex-start; }
.home-links { display: flex; flex-wrap: wrap; align-items: center; gap: 0 22px; }
.linkbtn.story-link { font-size: 18px; font-weight: 700; color: var(--ink); padding: 12px 0; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.story { display: flex; flex-direction: column; gap: 16px; max-width: 60ch; }
.story p { font-size: 17px; line-height: 1.6; }
.story .story-lead { font-family: var(--font-display); font-size: 24px; line-height: 1.25; color: var(--accent); }
.story .story-quote { font-family: var(--font-display); font-size: 28px; line-height: 1.2; text-wrap: balance; padding-block: 8px; }
.story .story-sign { font-weight: 700; }

.agree { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; line-height: 1.4; }
.agree input { width: 22px; height: 22px; flex: none; margin: 1px 0 0; accent-color: var(--accent); }
.terms { display: flex; flex-direction: column; gap: 10px; }
.term { border: 1.5px solid var(--line); border-radius: 16px; background: var(--surface); padding: 0 16px; }
.term summary { list-style: none; cursor: pointer; padding: 12px 0; font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 48px; }
.term summary::-webkit-details-marker { display: none; }
.term summary::after { content: "+"; font-size: 22px; font-weight: 500; color: var(--ink-2); }
.term[open] summary::after { content: "\2212"; }
.term-body { padding-bottom: 14px; display: flex; flex-direction: column; gap: 8px; color: var(--ink-2); font-size: 15.5px; line-height: 1.55; }
.term-body ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }

.sports.two { grid-template-columns: 1fr 1fr; }
.live-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: 1px; }
.dock .dot.live { right: 18%; }
@media (prefers-reduced-motion: no-preference) {
  .live-dot, .dock .dot.live { animation: pulse 1.8s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--mustard) 70%, transparent); } 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
}

/* logo splash */
.splash {
  position: fixed; inset: 0; z-index: 100; background: var(--bg); display: grid; place-items: center; padding: 24px;
  transition: opacity .45s ease; cursor: pointer;
}
.splash.out { opacity: 0; pointer-events: none; }
.splash svg { width: min(100%, 460px); height: auto; overflow: visible; }
.lg-word { opacity: 0; animation: lgword .6s ease-out 1.05s forwards; }
.lg-tag { opacity: 0; animation: lgfade .5s ease-out 1.4s forwards; }
.lg-motion { opacity: 0; animation: lgmo .45s ease-out 1.05s forwards; }
@keyframes lgword { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes lgfade { to { opacity: 1; } }
@keyframes lgmo { 0% { opacity: 0; transform: translateX(-10px); } 100% { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .lg-word, .lg-tag, .lg-motion { opacity: 1; animation: none; }
  .splash { transition: none; }
}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><span id="brand-ball" aria-hidden="true"></span><b><span class="b1">Catch</span><span class="b2">App</span></b></div>
    <div class="top-right">
      <button class="city-btn" id="city-btn" data-action="goto" data-value="me" aria-label="Your city">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.2A7 7 0 0 1 19 9.8C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.8" r="2.4"/></svg>
        <span id="city-text">Set city</span>
      </button>
      <button class="me-btn" id="me-btn" data-action="goto" data-value="me" aria-label="Your profile">Y</button>

</div>

<nav class="dock" id="dock" aria-label="Main">

  <button data-action="goto" data-value="home">Home</button>
  <button data-action="goto" data-value="nearby" id="dock-nearby">Nearby</button>
  <button data-action="goto" data-value="post">Post</button>
  <button data-action="goto" data-value="catches" id="dock-catches">Catches</button>
</nav>
<div id="toast-slot" aria-live="polite"></div>

<div class="splash" id="splash" role="img" aria-label="CatchApp. Catch up.">
  <svg viewBox="0 0 830 440" aria-hidden="true">
    <defs>
      <path id="tagpath" d="M178 150 Q335 66 498 108" fill="none"/>
      <clipPath id="ballclip"><circle r="55"/></clipPath>
    </defs>
    <g class="lg-motion" stroke="var(--logo-red)" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M548 124 L588 137"/><path d="M572 104 L622 118"/><path d="M604 86 L654 96"/>
    </g>
    <path id="lg-arc" d="M75 245 Q300 60 640 190" fill="none" stroke="var(--logo-red)" stroke-width="9" stroke-linecap="round"/>
    <text class="lg-tag" font-family="Figtree, system-ui, sans-serif" font-weight="700" font-size="36" letter-spacing="15" fill="var(--logo-red)">
      <textPath href="#tagpath">CATCH UP</textPath>
    </text>
    <text class="lg-word" x="42" y="392" font-family="Figtree, system-ui, sans-serif" font-weight="800" font-size="150" textLength="626" lengthAdjust="spacingAndGlyphs"><tspan fill="var(--logo-navy)">Catch</tspan><tspan fill="var(--logo-red)">App</tspan></text>
    <g id="lg-ball" transform="translate(75 245) scale(.3)">
      <circle r="58" fill="var(--surface)" stroke="var(--logo-navy)" stroke-width="8"/>
      <g clip-path="url(#ballclip)" fill="none" stroke="var(--logo-red)">
        <path d="M-52 -34 C-28 -14 -26 14 -42 46" stroke-width="4"/><path d="M-52 -34 C-28 -14 -26 14 -42 46" stroke-width="14" stroke-dasharray="3.5 11"/>
        <path d="M32 -46 C12 -22 12 16 36 52" stroke-width="4"/><path d="M32 -46 C12 -22 12 16 36 52" stroke-width="14" stroke-dasharray="3.5 11"/>
      </g>
    </g>
  </svg>
</div>

      '<p>CatchApp came from the mind of Joe and the practicality of his buddy Olly. They’re a couple of friends from a small liberal arts college who could not stop talking about baseball. What they wanted most was simple: someone to throw a ball back and forth with on any open stretch of grass.</p>' +
      '<p>Playing catch might be the purest thing in sports. No teams, no scoreboard, nobody keeping score. Just the pop of the ball in the glove, a little conversation, and the light going soft in the evening. For a lot of us it is where the game began, usually with a parent, a sibling or a friend.</p>' +

      '<p>So they built CatchApp. Post a time and a park, find someone nearby, throw for a while, and say thanks. Football, hoops and soccer are in here too, because the idea is the same: more people outside, playing together.</p>' +

  }
  function updateHeader() {
    var me = document.getElementById("me-btn");
    me.textContent = initials(state.profile.name);
    if (state.tab === "me") me.setAttribute("aria-current", "page"); else me.removeAttribute("aria-current");
    var city = state.profile.city.trim();
    document.getElementById("city-text").textContent = city ? city.split(",")[0] : "Set city";
    var av = document.getElementById("avatar-lg"); if (av) av.textContent = initials(state.profile.name);
  }
  function applySport() {
    document.documentElement.setAttribute("data-sport", state.sport);
    document.getElementById("brand-ball").innerHTML = ball(28, true);
  }

  function render() {
    var views = { home: homeView, nearby: nearbyView, post: postView, catches: catchesView, me: profileView, story: storyView, terms: termsView };
    document.getElementById("main").innerHTML = views[state.tab]();
    updateChrome();
  }

  var toastTimer;
  function toast(msg) {
    var slot = document.getElementById("toast-slot");
    slot.innerHTML = '<div class="toast" role="status">' + esc(msg) + '</div>';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { slot.innerHTML = ""; }, 3400);
  }
  function goto(tab) {
    state.tab = tab;
    if (tab === "catches") state.requests.forEach(function (r) { r.seen = true; });
    save(); render(); window.scrollTo(0, 0);
  }
  function scheduleConfirm(id) {
    setTimeout(function () {
      var r = reqFor(id); if (!r || r.status !== "pending") return;
      r.status = "confirmed"; r.seen = state.tab === "catches"; save();
      var c = byId(id);
      toast((c ? first(c.name) : "Someone") + (c && c.day === "now" ? " said yes. Head over, about " + c.walk + " min." : " said yes. Time to catch up.")); render();
    }, 3500);
  }
  function scheduleTheirRating(id) {
    setTimeout(function () {
      var r = reqFor(id); if (!r || r.status !== "done" || r.theirStars) return;
      var c = byId(id), s = Math.random() < 0.7 ? 5 : 4;
      r.theirStars = s; state.received.unshift({ from: c ? first(c.name) : "Someone", stars: s }); save();
      toast((c ? first(c.name) : "Someone") + " rated you " + s + " balls"); render();
    }, 3500);
  }

  /* ---------- logo splash: the ball flies along the red arc, then the wordmark lands ---------- */
  function runSplash() {
    var el = document.getElementById("splash");
    if (!el) return;
    var arc = document.getElementById("lg-arc"), ballEl = document.getElementById("lg-ball");
    var P0 = [75, 245], P1 = [375, 48], P2 = [718, 196], T1 = 0.9;
    function B(t) { var u = 1 - t; return [u * u * P0[0] + 2 * u * t * P1[0] + t * t * P2[0], u * u * P0[1] + 2 * u * t * P1[1] + t * t * P2[1]]; }
    var E = B(T1), C1 = [P0[0] + T1 * (P1[0] - P0[0]), P0[1] + T1 * (P1[1] - P0[1])];
    arc.setAttribute("d", "M" + P0[0] + " " + P0[1] + " Q" + C1[0].toFixed(1) + " " + C1[1].toFixed(1) + " " + E[0].toFixed(1) + " " + E[1].toFixed(1));
    var L = 600; try { L = arc.getTotalLength(); } catch (e) {}
    arc.style.strokeDasharray = L;
    var FLY0 = 0.15, FLY = 1.0, HOLD = 2.4;
    function frame(sec) {
      var t = Math.min(Math.max((sec - FLY0) / FLY, 0), 1), e = 1 - (1 - t) * (1 - t);
      var p = B(e), s = 0.3 + 0.7 * e, rot = 720 * e;
      if (sec > FLY0 + FLY) { var tau = sec - FLY0 - FLY; s *= 1 + 0.07 * Math.exp(-7 * tau) * Math.cos(18 * tau); }
      ballEl.setAttribute("transform", "translate(" + p[0].toFixed(1) + " " + p[1].toFixed(1) + ") rotate(" + rot.toFixed(1) + ") scale(" + s.toFixed(3) + ")");
      arc.style.strokeDashoffset = L * (1 - Math.min(e / T1, 1));
    }
    var finished = false;
    function finish() {
      if (finished) return; finished = true;
      el.classList.add("out");
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); document.body.style.overflow = ""; }, 520);
    }
    el.addEventListener("click", finish);
    document.body.style.overflow = "hidden";
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) { frame(99); setTimeout(finish, 1200); return; }
    frame(0);
    var start = null;
    function tick(ts) {
      if (finished) return;
      if (start === null) start = ts;
      var sec = (ts - start) / 1000;
      frame(sec);
      if (sec >= HOLD) { finish(); return; }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]"); if (!el) return;
    var a = el.getAttribute("data-action"), v = el.getAttribute("data-value"), id = el.getAttribute("data-id");
    var d = state.draft, rt = state.rating;
    switch (a) {
      case "goto": goto(v); return;
      case "sport":
        state.sport = v;
        if (SPOTS[v].indexOf(d.spot) === -1) d.spot = SPOTS[v][0];
        applySport(); save(); break;
      case "save-profile":
        if (!state.profile.agreed) { toast("Please confirm you are 18 or older and agree to the terms"); return; }
        state.profile.done = true; save(); toast(state.profile.name.trim() ? "Welcome, " + first(state.profile.name.trim()) : "Profile saved");
        goto("home"); return;
      case "ask":
        if (!reqFor(id)) { state.requests.unshift({ id: "r" + Date.now(), catchId: id, status: "pending", seen: false }); save(); toast("Request sent to " + first(byId(id).name)); scheduleConfirm(id); }
        break;
      case "cancel": state.requests = state.requests.filter(function (r) { return r.catchId !== id; }); save(); toast("Request cancelled"); break;
      case "nomeet": state.requests = state.requests.filter(function (r) { return r.catchId !== id; }); state.rating = null; save(); toast("No problem. We skipped the rating."); break;
      case "report-open": state.reportOpen = id; break;
      case "report-close": state.reportOpen = null; break;
      case "block":
        state.blocked.push(id); state.requests = state.requests.filter(function (r) { return r.catchId !== id; });
        state.reportOpen = null; save(); toast("Blocked. You will not see their posts."); break;
      case "report": state.reportOpen = null; toast("Report sent. Thanks for flagging it."); break;
      case "remove-post": state.mine = state.mine.filter(function (c) { return c.id !== id; }); save(); toast("Post removed"); break;
      case "rate-open": state.rating = { id: id, stars: 0, tags: [], safe: true, block: false }; break;
      case "rate-cancel": state.rating = null; break;
      case "star":
        var n = parseInt(v, 10);
        if (rt) { if ((rt.stars >= 4) !== (n >= 4)) rt.tags = []; rt.stars = n; }
        break;
      case "rtag": if (rt) { var ti = rt.tags.indexOf(v); if (ti > -1) rt.tags.splice(ti, 1); else rt.tags.push(v); } break;
      case "safe": if (rt) { rt.safe = v === "yes"; if (rt.safe && rt.stars > 2) rt.block = false; } break;
      case "rblock": if (rt) rt.block = !rt.block; break;
      case "rate-submit":
        if (!rt || !rt.stars) return;
        var rq = reqFor(rt.id), who = byId(rt.id);
        if (!rq) { state.rating = null; break; }
        rq.status = "done"; rq.stars = rt.stars; rq.tags = rt.tags.slice(); rq.safe = rt.safe;
        if (rt.block && state.blocked.indexOf(rt.id) === -1) state.blocked.push(rt.id);
        state.rating = null; save();
        toast(rt.safe ? "Rating sent. " + (who ? first(who.name) : "They") + " will see it." : "Thanks for telling us. We will review this.");
        if (rt.safe) scheduleTheirRating(rt.id);
        break;
      case "find-parks": findParks(); return;
      case "go-now": state.nearbyMode = "now"; goto("nearby"); return;
      case "mode": state.nearbyMode = v; break;
      case "ldur": state.live.dur = parseInt(v, 10); break;
      case "go-live":
        if (liveSpots().indexOf(state.live.spot) === -1) state.live.spot = liveSpots()[0];
        state.live.on = true; state.live.until = Date.now() + state.live.dur * 60000; state.ping = null;
        toast("You are live. People nearby can ping you."); scheduleIncomingPing(); break;
      case "stop-live": state.live.on = false; state.ping = null; toast("You are no longer available"); break;
      case "accept-ping":
        var pc = state.ping && byId(state.ping.id);
        if (pc) {
          state.requests.unshift({ id: "r" + Date.now(), catchId: pc.id, status: "confirmed", seen: false });
          state.live.on = false; save();
          toast("Accepted. " + first(pc.name) + " is about " + pc.walk + " min away.");
        }
        state.ping = null; break;
      case "decline-ping": state.ping = null; break;
      case "dur": d.dur = parseInt(v, 10); break;
      case "post":
        if (!d.time) { toast("Pick a start time first"); return; }
        state.mine.unshift({ id: "m" + Date.now(), mine: true, sport: state.sport, name: myName(), day: d.day, time: fmtTime(d.time), dur: d.dur, spot: d.spot, rating: 0 });
        save(); toast("Posted. Someone nearby can now ask to catch up.");
        goto("catches"); return;
      default: return;
    }
    render();
  });
  document.addEventListener("input", function (e) {
    var f = e.target.getAttribute("data-pfield");
    if (f) { state.profile[f] = e.target.value; save(); updateHeader(); }
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "pf-agree") {
      state.profile.agreed = e.target.checked; save();
      var sb = document.querySelector('[data-action="save-profile"]'); if (sb) sb.disabled = !state.profile.agreed;
      return;
    }
    var f = e.target.getAttribute("data-field");
    if (f === "day" || f === "time" || f === "spot") state.draft[f] = e.target.value;
    if (f === "lspot") state.live.spot = e.target.value;
  });

  load();
  if (!state.profile.done) state.tab = "me";
  state.requests.forEach(function (r) {
    if (r.status === "pending") scheduleConfirm(r.catchId);
    else if (r.status === "done" && !r.theirStars && r.safe !== false) scheduleTheirRating(r.catchId);
  });
  setInterval(function () {
    if (!state.live.on) return;
    if (Date.now() >= state.live.until) { state.live.on = false; state.ping = null; toast("Your time is up. You are no longer available."); render(); }
    else if (state.tab === "nearby" && state.nearbyMode === "now") render();
  }, 20000);
  applySport();
  render();
  runSplash();
})();
</script>

</body></html>
